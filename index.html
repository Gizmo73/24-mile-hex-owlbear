<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Day Hex</title>
    <link rel="icon" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Defaults for before OBR.theme reports in, and for a light host.
         applyTheme() overrides these at runtime inside Owlbear. */
      :root {
        /* Owlbear renders each popover as a solid panel; a transparent body
           makes this extension the odd one out. applyTheme() swaps this for
           the host's own paper colour at runtime. */
        --bg: #ffffff;
        --text: #14141c;
        --text-dim: rgba(0, 0, 0, 0.6);
        --accent: #7c5cff;
        --border: rgba(0, 0, 0, 0.16);
        /* Neutral grey alphas read correctly on a light or a dark host. */
        --surface: rgba(127, 127, 127, 0.16);
        --surface-hover: rgba(127, 127, 127, 0.3);
        --warn-bg: rgba(200, 130, 0, 0.16);
        --warn-text: #8a5a00;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #222639;
          --text: #ffffff;
          --text-dim: rgba(255, 255, 255, 0.7);
          --accent: #bb99ff;
          --border: rgba(255, 255, 255, 0.16);
          --warn-text: #ffcc66;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        color: var(--text);
        font-family: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.45;
      }
      html { background: var(--bg); }
      body {
        background: var(--bg);
        padding: 14px 16px 18px;
        min-height: 100vh;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 30px;
      }
      .row + .row { margin-top: 6px; }
      label { color: var(--text); user-select: none; }
      .hint { color: var(--text-dim); font-size: 12px; margin-top: 1px; }
      hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 10px 0;
      }
      input[type="number"] {
        width: 62px;
        padding: 4px 6px;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        font: inherit;
      }
      input[type="color"] {
        width: 46px;
        height: 26px;
        padding: 0;
        background: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: pointer;
      }
      input[type="range"] {
        width: 132px;
        accent-color: var(--accent);
        cursor: pointer;
      }
      input[type="checkbox"] {
        width: 17px;
        height: 17px;
        accent-color: var(--accent);
        cursor: pointer;
      }
      .val {
        display: inline-block;
        min-width: 30px;
        text-align: right;
        color: var(--text-dim);
        font-variant-numeric: tabular-nums;
      }
      .nudge { display: flex; align-items: center; gap: 6px; }
      .nudge span { color: var(--text-dim); width: 9px; }
      .nudge input[type="range"] { width: 104px; }
      .nudge-row { gap: 8px; }
      .nudge-row .axis {
        color: var(--text-dim);
        width: 10px;
        flex: none;
      }
      .nudge-row input[type="range"] { flex: 1; min-width: 0; width: auto; }
      .nudge-row input[type="number"] { width: 66px; flex: none; }
      button.align {
        display: block;
        width: 100%;
        margin-top: 8px;
        background: none;
        color: var(--accent);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 7px 10px;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button.align:hover { background: var(--surface); }
      .align-hint { margin-top: 6px; }
      button.reset {
        background: none;
        color: var(--accent);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 11px;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button.reset:hover { background: var(--surface-hover); }
      #status {
        margin-top: 10px;
        padding: 7px 9px;
        border-radius: 4px;
        background: var(--surface);
        color: var(--text-dim);
        font-size: 12px;
        line-height: 1.45;
      }
      #status.warn {
        background: var(--warn-bg);
        color: var(--warn-text);
      }
      #status:empty { display: none; }
      body.readonly .controls { opacity: 0.55; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="controls">
      <div class="row">
        <label for="enabled">Show overlay</label>
        <input type="checkbox" id="enabled" />
      </div>

      <hr />

      <div class="row">
        <div>
          <label for="hexesAcross">Hexes across</label>
          <div class="hint">Small hexes per big hex</div>
        </div>
        <input type="number" id="hexesAcross" min="2" max="50" step="1" value="8" />
      </div>

      <div class="row">
        <label for="strokeColor">Colour</label>
        <input type="color" id="strokeColor" value="#FFCC00" />
      </div>

      <div class="row">
        <label for="strokeWidth">Line weight</label>
        <span class="nudge">
          <input type="range" id="strokeWidth" min="1" max="30" step="1" value="8" />
          <span class="val" id="strokeWidthVal">8</span>
        </span>
      </div>

      <hr />

      <div class="row">
        <div>
          <label>Origin nudge</label>
          <div class="hint">In grid cells</div>
        </div>
        <button class="reset" id="resetNudge" type="button">Reset</button>
      </div>
      <div class="row nudge-row">
        <span class="axis">X</span>
        <input type="range" id="offsetX" min="-8" max="8" step="0.01" value="0" />
        <input type="number" id="offsetXNum" step="0.01" value="0.00" />
      </div>
      <div class="row nudge-row">
        <span class="axis">Y</span>
        <input type="range" id="offsetY" min="-8" max="8" step="0.01" value="0" />
        <input type="number" id="offsetYNum" step="0.01" value="0.00" />
      </div>
      <button class="align" id="alignSelection" type="button">
        Align to selected item
      </button>
      <div class="hint align-hint">
        Put a token on the hex you want at the centre of a big hex, select it,
        then align.
      </div>
    </div>

    <div id="status"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
